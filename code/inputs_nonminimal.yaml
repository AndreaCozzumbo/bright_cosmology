#######################################################   COSMOLOGY SETTINGS   ############################################################

###########################################################################################################################################
Cosmology:
### Chose the name of your cosmological model

    CosmologicalModel       : 'non-minimal' #'LCDM'

Parameters:
### Choose of the model parameters

    Parameters  : {'A_s': 2.074087e-09, 'n_s': 0.96787333, 'h': 0.6690935, 'omega_b': 0.022480862, 'omega_cdm': 0.11857731, 'tau_reio': 0.051005613, 'N_ur': 0.00441, 'N_ncdm': 3, 'm_ncdm': '0.02, 0.02, 0.02'} #{}


Computation type:

    ### 'CLASS' imply that the model is computed using the internal version of CLASS
    ### 'external' gives you the posibility of choosing your own cosmo model

    Mode         : 'CLASS' # 'external'
    Settings     : {'Omega_Lambda': 0.,
                    'Omega_fld': 0.,
                    'Omega_smg': -1.,
                    'gravity_model': 'YOUR_GRAVITY_MODEL',    # name of the model in your hi_class
                    'parameters_smg': 'YOUR_PARAMETERS'}      # comma separated, see your hi_class

ModifiedGravity: 
    
    MGBool        : True

    MGparameters  : {'ParametricMG': False} #{'Xi0': 0.97, 'n': 2.5, 'ParametricMG': True}

#  If you want to use mochi_class, use Settings :{} your settings for mochi_class
# and MGparameters : {'ParametricMG': False}


